<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniT — Tasks & Calendar</title>
  <link rel="icon" type="image/png" href="/UniT.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css" />
  <script type="module" src="/src/app.ts" defer></script>
</head>
<body>

<video class="app-bg" id="app-bg" autoplay loop muted playsinline preload="auto" aria-hidden="true">
  <source src="/background.mp4" type="video/mp4">
</video>
<div class="app-bg-overlay" id="app-bg-overlay" aria-hidden="true"></div>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="/UniT.png" alt="UniT">
      <div class="brand-name">UniT</div>
    </div>

    <div class="nav-item" data-view="my-day">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 3v1M12 20v1M4.93 4.93l.7.7M18.36 18.36l.71.71M3 12h1M20 12h1M4.93 19.07l.7-.7M18.36 5.64l.71-.71"/></svg>
      <span data-i18n="nav.myDay">My Day</span>
      <span class="nav-count" id="count-my-day">0</span>
    </div>
    <div class="nav-item active" data-view="planned">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path stroke-linecap="round" d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span data-i18n="nav.planned">Planned</span>
      <span class="nav-count" id="count-planned">0</span>
    </div>
    <div class="nav-item" data-view="important">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.8L18 21l-6-3.5L6 21l1.4-7.2L2.2 9l6.9-.7L12 2z"/></svg>
      <span data-i18n="nav.important">Important</span>
    </div>
    <div class="nav-item" data-view="tasks">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <span data-i18n="nav.tasks">Tasks</span>
    </div>

    <div class="nav-section-label" data-i18n="nav.lists">Lists</div>
    <div class="nav-item" data-view="list:work"><svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg><span data-i18n="nav.work">Work</span></div>
    <div class="nav-item" data-view="list:personal"><svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="#d93025" stroke="none"/></svg><span data-i18n="nav.personal">Personal</span></div>
    <div class="nav-item" data-view="list:meeting"><svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="#7a5af8" stroke="none"/></svg><span data-i18n="nav.meetings">Meetings</span></div>

    <div style="margin-top: auto; border-top: 1px solid var(--ink-200); padding-top: 10px; display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; gap: 6px; padding: 0 2px 6px;">
        <button class="btn" id="btn-import" data-i18n="bottom.import" style="flex:1; padding: 5px 6px; font-size: 11px;">Import</button>
        <button class="btn" id="btn-export" data-i18n="bottom.export" style="flex:1; padding: 5px 6px; font-size: 11px;">Export</button>
      </div>
      <label style="display: flex; align-items: center; gap: 6px; padding: 4px 4px; font-size: 11px; color: var(--ink-500); cursor: pointer;">
        <input type="checkbox" id="chk-autostart" style="width: 14px; height: 14px;" />
        <span data-i18n="bottom.autostart">Launch at startup</span>
      </label>
      <label style="display: flex; align-items: center; gap: 6px; padding: 4px 4px; font-size: 11px; color: var(--ink-500); cursor: pointer;">
        <input type="checkbox" id="chk-video-bg" style="width: 14px; height: 14px;" />
        <span data-i18n="bottom.videoBg">Video background</span>
      </label>
      <button class="btn" id="btn-backgrounds" data-i18n="bottom.backgrounds" style="padding: 5px 6px; font-size: 11px; margin: 2px;">Change background…</button>
      <div class="bg-popover" id="bg-popover">
        <div class="bg-popover-header" data-i18n="bg.title">Backgrounds</div>
        <div class="bg-list" id="bg-list"></div>
        <button class="btn bg-add-btn" id="bg-add-btn" data-i18n="bg.add">+ Add video file…</button>
      </div>
      <button class="btn" id="btn-gcal" data-i18n="bottom.connectGcal" style="padding: 5px 6px; font-size: 11px; margin: 2px;">Connect Google Calendar</button>
      <div style="padding: 4px 4px; font-size: 11px; color: var(--ink-400); display: flex; align-items: center; gap: 8px;">
        <div style="width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #f5a623, #d93025); display:grid; place-items:center; color: white; font-weight: 600; font-size: 10px;">•</div>
        <div>
          <div class="editable-field" style="color: var(--ink-700); font-weight: 500;" id="user-name" contenteditable="true" spellcheck="false" title="Click to edit name">You</div>
          <div class="editable-field" id="user-sub" contenteditable="true" spellcheck="false" title="Click to edit status" data-placeholder="Add status"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="main-header">
      <div class="title-block">
        <h1 id="view-title">Planned</h1>
        <div class="subtitle" id="view-subtitle">Your upcoming tasks and meetings</div>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <div class="view-switch">
          <button class="active" data-mode="list">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
            <span data-i18n="view.list">List</span>
          </button>
          <button data-mode="calendar">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path stroke-linecap="round" d="M3 9h18M8 2v4M16 2v4"/></svg>
            <span data-i18n="view.calendar">Calendar</span>
          </button>
        </div>
        <button class="icon-btn" id="btn-theme" title="Toggle theme">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        </button>
        <select id="sel-locale" title="Language" style="padding:4px 6px; font-size:12px; border:1px solid var(--ink-200); border-radius:6px; background:var(--bg-panel); color:var(--ink-700);">
          <option value="en">EN</option>
          <option value="vi">VI</option>
        </select>
      </div>
    </div>

    <div class="content" id="list-view">
      <div class="gcal-banner" id="gcal-banner" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="2" stroke="#0f62fe" stroke-width="1.8"/><path d="M3 9h18" stroke="#0f62fe" stroke-width="1.8"/></svg>
        <div class="dot-live"></div>
        <span><strong style="color: var(--ink-900);">Google Calendar connected.</strong> Tasks tagged <code style="background: var(--bg-hover); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 11px;">#meeting</code> auto-sync as events.</span>
      </div>

      <div id="groups-container"></div>

      <div class="add-task-bar">
        <div class="add-task-inner">
          <svg class="plus" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
          <input id="add-input" data-i18n="add.placeholder" data-i18n-attr="placeholder" placeholder="Add a task — try: 'Call dentist tomorrow 3pm #meeting'" />
          <div class="add-hint"><span class="kbd">⏎</span> <span data-i18n="add.hint">Add</span></div>
        </div>
      </div>
    </div>

    <!-- Calendar View -->
    <div class="calendar-view" id="calendar-view">
      <div class="cal-bar">
        <button class="today-btn" id="cal-today-btn">Today</button>
        <button class="nav-arrow" id="cal-prev"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M15 18l-6-6 6-6"/></svg></button>
        <button class="nav-arrow" id="cal-next"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M9 18l6-6-6-6"/></svg></button>
        <div class="month-label" id="cal-month-label"></div>
      </div>

      <div class="week-grid">
        <div class="week-header" id="week-header"></div>
        <div class="week-body" id="week-body"></div>
      </div>

      <div style="font-size: 11.5px; color: var(--ink-400); display: flex; gap: 18px; align-items: center;">
        <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width:10px;height:10px;border-radius:3px;background:var(--meeting-soft);border-left:3px solid var(--meeting);"></span> Meeting</span>
        <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width:10px;height:10px;border-radius:3px;background:var(--accent-soft);border-left:3px solid var(--accent);"></span> Task</span>
      </div>
    </div>
  </main>

  <!-- DETAIL PANEL -->
  <aside class="detail" id="detail-panel">
    <div class="detail-header">
      <h3 data-i18n="detail.title">Task Details</h3>
      <button class="icon-btn" id="close-detail"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M6 18L18 6"/></svg></button>
    </div>
    <div class="detail-body" id="detail-body">
      <div class="empty">Select a task to view details.</div>
    </div>
    <div class="detail-footer" id="detail-footer" style="display: none;">
      <span id="created-stamp">Created today</span>
      <button id="delete-task"><svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="vertical-align: middle;"><path stroke-linecap="round" stroke-width="2" d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>
    </div>
  </aside>
</div>

<!-- DATE PICKER POPOVER -->
<div class="date-popover" id="date-popover">
  <div class="dp-quick">
    <button data-preset="today"><span>⏱</span><span data-i18n="today">Today</span></button>
    <button data-preset="tomorrow"><span>→</span><span data-i18n="tomorrow">Tomorrow</span></button>
    <button data-preset="nextWeek"><span>»</span><span data-i18n="dp.nextWeek">Next week</span></button>
  </div>
  <div class="dp-cal">
    <div class="dp-nav">
      <button class="dp-arrow" id="dp-prev">‹</button>
      <span class="dp-label" id="dp-label"></span>
      <button class="dp-arrow" id="dp-next">›</button>
    </div>
    <div class="dp-weekdays">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div class="dp-grid" id="dp-grid"></div>
  </div>
  <div class="dp-time-row">
    <span data-i18n="modal.time">Time</span>
    <input type="time" id="dp-time" />
  </div>
  <div class="dp-foot">
    <button class="btn" id="dp-clear" data-i18n="dp.clear">Clear</button>
    <button class="btn primary" id="dp-save" data-i18n="modal.save">Save</button>
  </div>
</div>

</body>
</html>
